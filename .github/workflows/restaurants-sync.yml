name: Restaurants Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  restaurants:
    name: Update restaurants JSON and README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export restaurants
        run: npm run export:restaurants

      - name: Update README
        run: npm run generate

      - name: Format
        run: npx prettier --write README.md data/restaurants.json

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ":floppy_disk: Persist restaurants sheet and README"
          file_pattern: README.md data/restaurants.json
